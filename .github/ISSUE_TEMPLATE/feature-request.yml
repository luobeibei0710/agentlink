name: 功能建议
description: 提出一个新功能或改进
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        建议先看 README 的[与原版 hapi 的关系](https://github.com/luobeibei0710/agentlink/blob/main/README.md#与原版-hapi-的关系)——
        如果这个能力上游已经有了（Hub 同步、Web 客户端等），提到 [tiann/hapi](https://github.com/tiann/hapi) 会更合适。

  - type: textarea
    id: problem
    attributes:
      label: 你遇到的场景
      description: 先说清楚问题本身，不必急着给方案 —— 这样更容易一起讨论出更合适的做法
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: 你设想的做法
    validations:
      required: false

  - type: dropdown
    id: side
    attributes:
      label: 涉及哪一侧
      options:
        - 手机端
        - 电脑端
        - 两者都涉及
        - 不确定
    validations:
      required: true
