name: Android Release

# 打 tag 即发布；也可以手动指定 tag 重发（例如上一次构建失败后重跑）。
# 刻意不监听 pull_request —— 只有 tag 与手动触发才会拿到签名密钥。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布或重发的 tag（例如 v1.12.1）'
        required: true
        type: string

# 创建 / 更新 Release 需要写权限。
permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: 准备 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 固定版本而非跟随 stable：pubspec 要求 Dart ^3.11.5，3.41.8 与之匹配，
      # 也是本地出包时验证过的版本。
      - name: 准备 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.8'
          channel: stable
          cache: true

      - name: 校验 tag 与 pubspec 版本一致
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          raw=$(sed -nE 's/^version:[[:space:]]*//p' flutter/pubspec.yaml | head -1)
          version="${raw%%+*}"
          if [ -z "$version" ]; then
            echo "::error::没能从 flutter/pubspec.yaml 读到 version"
            exit 1
          fi
          if [ "v$version" != "$TAG" ]; then
            echo "::error::pubspec 的版本是 $version，与 tag $TAG 对不上；先把版本改好再打 tag"
            exit 1
          fi
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          echo "版本 $version 与 $TAG 一致"

      # 缺少正式密钥时直接失败，而不是悄悄退回 debug 签名 —— 那样构建出的包无法覆盖
      # 安装已发布版本，用户会看到「应用未安装」却查不出原因。
      - name: 还原发布签名
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::缺少 secret ANDROID_KEYSTORE_BASE64，无法做正式签名"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > flutter/android/key.properties

      - name: 获取依赖
        working-directory: flutter
        run: flutter pub get

      - name: 构建 APK
        working-directory: flutter
        run: flutter build apk --release

      - name: 重命名并生成校验文件
        working-directory: flutter/build/app/outputs/flutter-apk
        run: |
          mv app-release.apk "AgentLink-$APP_VERSION-android.apk"
          sha256sum "AgentLink-$APP_VERSION-android.apk" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # 已存在同名 Release（手动重发）时沿用，仅替换附件。
      - name: 发布到 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "AgentLink ${TAG#v}" --generate-notes
          gh release upload "$TAG" \
            "flutter/build/app/outputs/flutter-apk/AgentLink-$APP_VERSION-android.apk" \
            "flutter/build/app/outputs/flutter-apk/SHA256SUMS.txt" \
            --clobber
          echo "已发布 $TAG"

      - name: 写入构建摘要
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          {
            echo "## AgentLink $APP_VERSION"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| 安装包 | \`AgentLink-$APP_VERSION-android.apk\` |"
            echo "| SHA-256 | \`$(cut -d' ' -f1 flutter/build/app/outputs/flutter-apk/SHA256SUMS.txt)\` |"
            echo "| Release | https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG |"
          } >> "$GITHUB_STEP_SUMMARY"
